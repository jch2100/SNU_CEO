<script>
(() => {
  const key = new URLSearchParams(location.hash.slice(1)).get("key");
  const target = new URL("../autobiography/viewer.html", location.href);
  target.searchParams.set("id", "an-seon-hui");
  target.searchParams.set("cohort", "17");
  if (key) target.hash = "key=" + encodeURIComponent(key);
  if (!/^[A-Za-z0-9_-]{43}$/.test(key || "")) return;
  const reader = document.createElement("iframe");
  reader.title = "자서전 플립북";
  reader.referrerPolicy = "no-referrer";
  reader.src = target.href;
  document.body.append(reader);
  document.body.classList.add("reading");
})();
</script>
