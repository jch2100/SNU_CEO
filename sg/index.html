<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#071421">
  <title>AI 자서전 열기</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      color: #f6f0e4;
      background:
        radial-gradient(circle at 50% 12%, rgba(111, 143, 181, .2), transparent 34rem),
        #071421;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 420px);
      padding: 34px 28px;
      border: 1px solid rgba(255, 255, 255, .18);
      background: rgba(255, 255, 255, .05);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 25px;
      line-height: 1.4;
    }

    p {
      margin: 0 0 24px;
      color: rgba(255, 255, 255, .72);
      line-height: 1.7;
    }

    button {
      min-width: 170px;
      min-height: 48px;
      padding: 11px 22px;
      border: 1px solid rgba(255, 255, 255, .38);
      color: inherit;
      background: rgba(255, 255, 255, .09);
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: #c8a86b;
      background: rgba(255, 255, 255, .15);
    }
  </style>
</head>
<body>
  <main>
    <h1>자서전을 열고 있습니다</h1>
    <p id="status">잠시만 기다려 주세요.<br>자동으로 열리지 않으면 아래 버튼을 눌러 주세요.</p>
    <button type="button" id="openBook">자서전 열기</button>
  </main>

  <script>
    (() => {
      const destination = "/autobiography/viewer.html?id=lee-seung-gu#key=gxBy8__am-d9z5l3DfmwqK_iAWffunwR8NSh3DhYHv8";
      const openBook = () => window.location.replace(destination);

      document.getElementById("openBook").addEventListener("click", openBook);

      try {
        openBook();
      } catch (error) {
        document.getElementById("status").textContent =
          "자동으로 열지 못했습니다. 아래 버튼을 눌러 다시 시도해 주세요.";
      }
    })();
  </script>
</body>
</html>
